# Escaneo de secretos con gitleaks.
# Corre en cada push y PR sobre TODO el historial (fetch-depth: 0) → detecta una
# clave aunque haya sido "borrada" en un commit posterior (sigue viva en la historia).
# Usamos el binario directo (no la Action gitleaks/gitleaks-action@v2, que pide
# GITLEAKS_LICENSE en cuentas de organización). El binario es MIT, gratis.
#
# Si encuentra un secreto: falla el job (exit 1) y lo muestra REDACTADO en el log.
# Falsos positivos conocidos (anon key público) se allowlistean en .gitleaks.toml.

name: gitleaks
run-name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historia completa

      - name: Instalar gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Escanear historial
        run: gitleaks detect --source . --redact --config .gitleaks.toml --exit-code 1
