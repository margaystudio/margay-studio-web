<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Ilustraciones sistemas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.v{width:344px;height:200px;background:#F6F8F5;overflow:hidden}
.v svg{display:block;width:344px;height:200px}
text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}
</style></head><body>

<!-- 1 · COMERCIAL: una oportunidad recorre las etapas hasta "Ganada" -->
<div class="v" id="v1"><svg viewBox="0 0 344 200" fill="none">
<!-- prospecto (outline) -->
<g transform="translate(40 52)" stroke="#8A978F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<circle cx="30" cy="20" r="14" fill="#fff"/>
<path d="M4 72c0-16 12-28 26-28s26 12 26 28v4H4z" fill="#fff"/>
</g>
<!-- camino con etapas -->
<path d="M110 96 H236" stroke="#C9D3CC" stroke-width="3" stroke-linecap="round"/>
<path d="M110 96 H236" stroke="#7CC39C" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 1" opacity="0"/>
<circle cx="134" cy="96" r="6" fill="#7CC39C"/><circle cx="172" cy="96" r="6" fill="#7CC39C"/><circle cx="210" cy="96" r="6" fill="#7CC39C"/>
<path d="M228 88l10 8-10 8" stroke="#7CC39C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- cliente (filled) -->
<g transform="translate(244 52)">
<circle cx="30" cy="20" r="14" fill="#7CC39C" stroke="#0E1A14" stroke-width="2.5"/>
<path d="M4 72c0-16 12-28 26-28s26 12 26 28v4H4z" fill="#7CC39C" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="52" cy="58" r="12" fill="#fff" stroke="#0E1A14" stroke-width="2.5"/><path d="M46.5 58l3.5 3.5 7.5-7.5" stroke="#0E1A14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="70" y="150" text-anchor="middle" font-size="12" fill="#5C6B62">Prospecto</text>
<text x="274" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#0E1A14">Cliente</text>
<text x="172" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1A14">De prospecto a cliente</text>
</svg></div>

<!-- 2 · COMPRAS Y PAGOS: la orden y la factura encajan -->
<div class="v" id="v2"><svg viewBox="0 0 344 200" fill="none">
<path d="M30 118 H314" stroke="#C9D3CC" stroke-width="3" stroke-linecap="round"/>
<path d="M118 110l8 8-8 8M222 110l8 8-8 8" stroke="#7CC39C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- orden de compra: carrito -->
<g transform="translate(40 50)"><path d="M0 8a8 8 0 0 1 8-8h32l16 16v44a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#fff" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 0v16h16" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M12 30h5l5 20h18l4-13H20" stroke="#0E1A14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="56" r="2.5" fill="#0E1A14"/><circle cx="37" cy="56" r="2.5" fill="#0E1A14"/>
</g>
<!-- factura: importe -->
<g transform="translate(144 50)"><path d="M0 8a8 8 0 0 1 8-8h32l16 16v44a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#fff" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 0v16h16" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="11" y="28" width="22" height="4" rx="2" fill="#C9D3CC"/><rect x="11" y="37" width="30" height="4" rx="2" fill="#C9D3CC"/>
<text x="9" y="60" font-size="10.5" font-weight="700" fill="#0E1A14">$ 412.300</text>
</g>
<!-- orden de pago: sello verde -->
<g transform="translate(248 50)"><path d="M0 8a8 8 0 0 1 8-8h32l16 16v44a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#fff" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 0v16h16" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="28" cy="44" r="14" fill="#7CC39C" stroke="#0E1A14" stroke-width="2.5"/><path d="M21 44l5 5 10-10" stroke="#0E1A14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="68" y="150" text-anchor="middle" font-size="12" fill="#5C6B62">Orden de compra</text>
<text x="172" y="150" text-anchor="middle" font-size="12" fill="#5C6B62">Factura</text>
<text x="276" y="150" text-anchor="middle" font-size="12" fill="#5C6B62">Orden de pago</text>
<text x="172" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1A14">Un solo circuito, de la compra al pago</text>
</svg></div>

<!-- 3 · PEDIDOS Y PRODUCCIÓN: del pedido a la entrega -->
<div class="v" id="v3"><svg viewBox="0 0 344 200" fill="none">
<!-- conveyor -->
<path d="M30 118 H314" stroke="#C9D3CC" stroke-width="3" stroke-linecap="round"/>
<circle cx="60" cy="118" r="4" fill="#C9D3CC"/><circle cx="110" cy="118" r="4" fill="#C9D3CC"/><circle cx="160" cy="118" r="4" fill="#C9D3CC"/><circle cx="210" cy="118" r="4" fill="#C9D3CC"/><circle cx="260" cy="118" r="4" fill="#C9D3CC"/>
<!-- station 1: pedido (ticket) -->
<g transform="translate(40 58)">
<path d="M0 6a6 6 0 0 1 6-6h36a6 6 0 0 1 6 6v14a6 6 0 0 0 0 12v14a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V32a6 6 0 0 0 0-12z" fill="#fff" stroke="#0E1A14" stroke-width="2.5"/>
<rect x="11" y="14" width="26" height="4" rx="2" fill="#0E1A14"/><rect x="11" y="24" width="18" height="4" rx="2" fill="#C9D3CC"/><rect x="11" y="34" width="22" height="4" rx="2" fill="#C9D3CC"/>
</g>
<!-- station 2: producción (horno) -->
<g transform="translate(142 50)">
<rect x="0" y="0" width="60" height="60" rx="10" fill="#F6CEA8" stroke="#0E1A14" stroke-width="2.5"/>
<rect x="10" y="18" width="40" height="30" rx="5" fill="#fff" stroke="#0E1A14" stroke-width="2.5"/>
<circle cx="14" cy="9" r="2.5" fill="#0E1A14"/><circle cx="24" cy="9" r="2.5" fill="#0E1A14"/><circle cx="34" cy="9" r="2.5" fill="#0E1A14"/>
<path d="M22 30c0-5 4-5 4-9M30 30c0-5 4-5 4-9M38 30c0-5 4-5 4-9" stroke="#0E1A14" stroke-width="2" stroke-linecap="round"/>
</g>
<!-- station 3: entrega (caja) -->
<g transform="translate(246 56)">
<path d="M0 18l30-14 30 14v30L30 62 0 48z" fill="#7CC39C" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M0 18l30 14 30-14M30 32v30" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<!-- labels -->
<text x="64" y="150" text-anchor="middle" font-size="12" fill="#5C6B62">Pedido</text>
<text x="172" y="150" text-anchor="middle" font-size="12" fill="#5C6B62">Producción</text>
<text x="276" y="150" text-anchor="middle" font-size="12" fill="#5C6B62">Entrega</text>
<text x="172" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1A14">Cada pedido, de punta a punta</text>
</svg></div>

</body></html>
